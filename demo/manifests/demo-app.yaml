apiVersion: appstudio.redhat.com/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: default-tenant
  labels:
    app.kubernetes.io/part-of: kubecon-demo
spec:
  displayName: "KubeCon 2026 Workload Identity Demo"
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Component
metadata:
  name: demo-app
  namespace: default-tenant
  labels:
    app.kubernetes.io/part-of: kubecon-demo
spec:
  componentName: demo-app
  application: demo-app
  containerImage: registry-service.kind-registry/slsa-e2e-test:latest
  source:
    git:
      url: https://github.com/konflux-ci/testrepo
      revision: main
      context: .
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: demo-app-ec-policy
  namespace: managed-tenant
  labels:
    app.kubernetes.io/part-of: kubecon-demo
spec:
  description: SLSA policy for demo-app dual-gated release
  sources:
    - name: Release Policies
      policy:
        - oci::quay.io/conforma/release-policy:konflux@sha256:1b296a925b4021f4b4959ea289596925a8735540e554f3ba7754a651731a216f
      config:
        include:
          - '@minimal'
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlan
metadata:
  name: demo-app-release-plan
  namespace: default-tenant
  labels:
    app.kubernetes.io/part-of: kubecon-demo
    release.appstudio.openshift.io/auto-release: "false"
spec:
  application: demo-app
  target: managed-tenant
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: demo-app-release-plan-admission
  namespace: managed-tenant
  labels:
    app.kubernetes.io/part-of: kubecon-demo
spec:
  applications:
    - demo-app
  origin: default-tenant
  environment: production
  policy: demo-app-ec-policy
  pipeline:
    serviceAccountName: release-service-account
    pipelineRef:
      resolver: git
      params:
        - name: url
          value: https://github.com/arewm/slsa-konflux-example
        - name: revision
          value: main
        - name: pathInRepo
          value: managed-context/pipelines/slsa-e2e-release-dual-gated/slsa-e2e-release-dual-gated.yaml
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: Snapshot
metadata:
  name: demo-app-snapshot
  namespace: default-tenant
  labels:
    appstudio.openshift.io/application: demo-app
    app.kubernetes.io/part-of: kubecon-demo
spec:
  application: demo-app
  components:
  - name: demo-app
    containerImage: registry-service.kind-registry/slsa-e2e-test:latest
    source:
      git:
        revision: e23b07349111de53ec6ce2fc06c9a004ee56ed78
        url: https://github.com/konflux-ci/testrepo
