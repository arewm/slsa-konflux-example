---
# Demo variant of the trivy-sbom-scan catalog task used by the Vault
# legacy-token-exchange demo (docs/reference/legacy-token-exchange.md).
#
# Identical identity shape as the catalog task (name => SPIFFE ID
# .../trusted/kind-konflux/default/trivy-sbom-scan), but the JWT-SVID
# audience is parameterized so the task can mint tokens for Vault
# (audience "vault") instead of the CVE database.
#
# Built, pushed, and cosign-signed by demo/vault-exchange-demo.sh into
# registry-service.kind-registry/tekton-catalog/trivy-sbom-scan:0.1-vault-demo
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-sbom-scan
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    Demo scanner task: fetches an audience-scoped JWT-SVID from the SPIFFE
    Workload API for exchange with Vault (legacy credential broker).
  params:
    - name: jwt-audience
      description: Audience to request when fetching the JWT-SVID (must match the consumer service).
      default: "vault"
  stepTemplate:
    volumeMounts:
      - mountPath: /spiffe-workload-api
        name: spiffe-workload-api
        readOnly: true
      - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
        name: trusted-ca
        readOnly: true
        subPath: ca-bundle.crt
  steps:
    - name: wait-spire
      image: cgr.dev/chainguard/busybox@sha256:19f02276bf8dbdd62f069b922f10c65262cc34b710eea26ff928129a736be791
      command:
        - sleep
        - '5'
    - name: fetch-jwt
      image: ghcr.io/spiffe/spire-agent:1.15.3
      command:
        - /opt/spire/bin/spire-agent
        - api
        - fetch
        - jwt
        - -audience
        - $(params.jwt-audience)
        - -socketPath
        - /spiffe-workload-api/spire-agent.sock
        - -output
        - json
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: trusted-ca
      configMap:
        name: trusted-ca
        items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
