# Arm64 overlay for sigstore/scaffold chart
#
# Pass this file to install.sh via EXTRA_VALUES when deploying on arm64 hosts
# (Apple Silicon, AWS Graviton, libkrun, etc.):
#
#   EXTRA_VALUES=$(pwd)/integrations/sigstore/values-arm64.yaml \
#     /path/to/konflux-ci/integrations/sigstore/install.sh
#
# Why these overrides are needed:
#
# 1. gcr.io/trillian-opensource-ci/db_server is amd64-only. Under QEMU
#    emulation, MySQL auto-sizes InnoDB to the full host RAM and gets OOMKilled.
#    mysql:8.0 is multi-arch and natively arm64.
#
# 2. The default probe command (/etc/init.d/mysql status) does not exist in
#    mysql:8.0 and the 1s timeout is too tight on constrained hardware.
#
# 3. In scaffold <= 0.6.114, docker.io/alpine/k8s was pinned to an amd64-only
#    digest, causing Go binaries to panic under QEMU (`lfstack.push invalid packing`).
#    Scaffold 0.6.115+ (sigstore/helm-charts#1234) updated copySecretJob to a multi-arch
#    digest (alpine/k8s:1.37.0). The override below aligns with the upstream multi-arch
#    digest for backward compatibility with scaffold <= 0.6.114; when deploying
#    scaffold >= 0.6.115, the copySecretJob section can be omitted.

trillian:
  mysql:
    image:
      registry: docker.io
      repository: library/mysql
      version: "8.0"
      pullPolicy: IfNotPresent
    # --ignore-db-dir is MariaDB-only; omit it for mysql:8.0
    args:
      - "--innodb-buffer-pool-size=32M"
      - "--innodb-log-buffer-size=8M"
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 5
      successThreshold: 1
      exec:
        command:
          - sh
          - -c
          - "mysqladmin ping -h 127.0.0.1 -u root --password=$MYSQL_ROOT_PASSWORD"
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1
      exec:
        command:
          - sh
          - -c
          - "mysqladmin ping -h 127.0.0.1 -u root --password=$MYSQL_ROOT_PASSWORD"

copySecretJob:
  # Aligned with upstream scaffold >= 0.6.115 (sigstore/helm-charts#1234).
  # Retained for backward compatibility with scaffold <= 0.6.114 (e.g. konflux-ci pin)
  # where the chart default pinned an amd64-only digest.
  registry: docker.io
  repository: alpine/k8s
  version: 1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
  pullPolicy: IfNotPresent
