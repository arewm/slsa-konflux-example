---
# Attach summary attestations (conforma VSA, SLSA VSA, SVR) to pushed container images.
# This task retrieves VSA files from trusted artifacts, generates an SVR, and attaches
# all requested attestation types to the destination container images.

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: attach-summary-attestations
  annotations:
    tekton.dev/displayName: Attach Summary Attestations
    tekton.dev/pipelines.minVersion: "0.19"
    tekton.dev/tags: vsa, attestation, cosign, svr
  labels:
    app.kubernetes.io/version: "0.1"

spec:
  description: |
    Attach summary attestations (Conforma VSA, SLSA VSA, SVR) to container images.

    This task reads VSA files from trusted artifacts, generates a Software Verification
    Report (SVR) from the conforma report, and attaches the requested attestation types
    as signed attestations to container images in the destination registry.

  params:
    - name: SNAPSHOT_FILENAME
      type: string
      description: The filename of the mapped Snapshot (with destination images)

    - name: SOURCE_DATA_ARTIFACT
      type: string
      description: Trusted Artifact containing the Snapshot and VSA files

    - name: VSA_GENERATED
      type: string
      description: Whether VSAs were generated by verify-conforma (true/false)
      default: "false"

    - name: VSA_SIGNING_KEY
      type: string
      description: >-
        Signing key for VSA predicates. Must be a k8s:// or file:// reference.
        Example: k8s://namespace/secret-name
      default: "k8s://managed-tenant/release-signing-key"

    - name: ATTESTATION_TYPES
      type: string
      description: >-
        Comma-separated list of attestation types to attach.
        Valid values: conforma-vsa, slsa-vsa, svr.
        Use this to disable specific attestation types.
      default: "conforma-vsa,slsa-vsa,svr"

    - name: ORAS_OPTIONS
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""

    - name: TRUSTED_ARTIFACTS_DEBUG
      description: Flag to enable debug logging in trusted artifacts
      type: string
      default: ""

    - name: TRUSTED_ARTIFACTS_EXTRACT_DIR
      description: Directory to use to extract trusted artifact archive
      type: string
      default: "/var/workdir/attach-summary-attestations"

    - name: HOMEDIR
      type: string
      description: Value for the HOME environment variable
      default: /tekton/home

    - name: SSL_CERT_DIR
      type: string
      description: SSL cert directory for external registry communication
      default: ""

    - name: CA_TRUST_CONFIGMAP_NAME
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca

    - name: CA_TRUST_CONFIG_MAP_KEY
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt

    - name: BASE_IMAGE_BUILDER_ID
      type: string
      description: >-
        Expected builder ID in base image provenance. If the base image
        provenance contains this builder ID, the dependency is recorded as
        SLSA Build Level 2. Example: https://tekton.dev/chains/v2
      default: ""

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: "ORAS_OPTIONS"
        value: "$(params.ORAS_OPTIONS)"
      - name: "DEBUG"
        value: "$(params.TRUSTED_ARTIFACTS_DEBUG)"
      - name: HOME
        value: "$(params.HOMEDIR)"
    securityContext:
      runAsUser: 1001

  steps:
    - name: use-trusted-artifact
      args:
        - use
        - $(params.SOURCE_DATA_ARTIFACT)=$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)
      computeResources: {}
      image: quay.io/redhat-appstudio/build-trusted-artifacts:e02102ede09aa07187cba066ad547a54724e5cf4

    - name: generate-slsa-vsa
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        if [[ "$(params.VSA_GENERATED)" != "true" ]]; then
          echo "VSA was not generated, skipping SLSA VSA generation"
          exit 0
        fi

        if ! echo "$(params.ATTESTATION_TYPES)" | grep -q "slsa-vsa"; then
          echo "slsa-vsa not in ATTESTATION_TYPES, skipping SLSA VSA generation"
          exit 0
        fi

        VSA_DIR="$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)/vsa"
        REPORT="$VSA_DIR/report-json.json"

        if [[ ! -f "$REPORT" ]]; then
          echo "WARNING: Conforma JSON report not found at $REPORT, skipping SLSA VSA generation"
          exit 0
        fi

        echo "Generating standard SLSA VSA from conforma report..."

        # Extract metadata from the report
        EC_VERSION=$(jq -r '."ec-version" // "unknown"' "$REPORT")
        EFFECTIVE_TIME=$(jq -r '."effective-time" // now' "$REPORT")
        POLICY_DESCRIPTOR=$(jq '{
          uri: (.policy.sources[0].policy[0] // "unknown"),
          digest: {}
        }' "$REPORT")

        # Generate one SLSA VSA per component with per-component verified levels.
        # If we reached this step, the policy passed for all components.
        COMPONENT_COUNT=$(jq '.components | length' "$REPORT")
        for i in $(seq 0 $((COMPONENT_COUNT - 1))); do
          COMPONENT=$(jq ".components[$i]" "$REPORT")
          IMAGE_REF=$(echo "$COMPONENT" | jq -r '.containerImage')
          COMPONENT_NAME=$(echo "$COMPONENT" | jq -r '.name')
          DIGEST_ALG=$(echo "$IMAGE_REF" | sed -n 's/.*@\(.*\):.*/\1/p')
          DIGEST_VAL=$(echo "$IMAGE_REF" | sed -n 's/.*@.*://p')

          echo "  Component: $COMPONENT_NAME ($IMAGE_REF)"

          VERIFIED_LEVELS='[]'

          # Build level: check if this component has slsa3 collection successes
          HAS_SLSA3=$(echo "$COMPONENT" | jq '[(.successes // [])[]
            | select(.metadata.collections != null)
            | select([.metadata.collections[] | select(. == "slsa3" or . == "slsa_build_l3")] | length > 0)
          ] | length')

          if [[ "$HAS_SLSA3" -gt 0 ]]; then
            VERIFIED_LEVELS=$(echo "$VERIFIED_LEVELS" | jq '. + ["SLSA_BUILD_LEVEL_3"]')
            echo "    Build track: SLSA_BUILD_LEVEL_3"
          fi

          # Source level: download provenance for THIS component's image and
          # extract SLSA_SOURCE_LEVEL_ACHIEVED from verify-source task(s).
          # Take the minimum level across all verify-source tasks (weakest link).
          PROVENANCE=$(cosign download attestation --allow-insecure-registry "$IMAGE_REF" 2>/dev/null \
            | jq -s '[.[] | select(.payloadType == "application/vnd.in-toto+json")
              | select(.payload | @base64d | fromjson | .predicateType == "https://slsa.dev/provenance/v0.2" or .predicateType == "https://slsa.dev/provenance/v1")]' 2>/dev/null) \
            || PROVENANCE='[]'

          SOURCE_LEVEL=$(echo "$PROVENANCE" | jq -r '
            [.[] | .payload | @base64d | fromjson |
              ((.predicate.buildConfig.tasks // [])[]
                | select(.name // "" | test("verify-source"))
                | (.results // [])[]
                | select(.name == "SLSA_SOURCE_LEVEL_ACHIEVED")
                | .value | gsub("\\s+"; "")),
              ((.predicate.buildDefinition.resolvedDependencies // [])[]
                | select(.name == "pipelineTask")
                | (.content | @base64d | fromjson) as $task
                | select(($task.metadata.labels["tekton.dev/pipelineTask"] // "") | test("verify-source"))
                | ($task.status.results // [])[]
                | select(.name == "SLSA_SOURCE_LEVEL_ACHIEVED")
                | .value | gsub("\\s+"; ""))
            ] | map(ltrimstr("SLSA_SOURCE_LEVEL_") | tonumber) | if length > 0 then min else empty end
          ' 2>/dev/null)

          if [[ -n "$SOURCE_LEVEL" ]]; then
            VERIFIED_LEVELS=$(echo "$VERIFIED_LEVELS" | jq --arg lvl "$SOURCE_LEVEL" '. + ["SLSA_SOURCE_LEVEL_" + $lvl]')
            echo "    Source track: SLSA_SOURCE_LEVEL_$SOURCE_LEVEL"
          else
            echo "    Source track: no verify-source result in provenance"
          fi

          # Dependency levels: verify base image signature and provenance
          DEPENDENCY_LEVELS='{}'

          # Get manifest annotations to find the base image.
          # For image indexes, resolve the first platform manifest.
          MANIFEST=$(skopeo inspect --raw --tls-verify=false "docker://${IMAGE_REF}" 2>/dev/null) || MANIFEST='{}'
          MEDIA_TYPE=$(echo "$MANIFEST" | jq -r '.mediaType // ""')

          if [[ "$MEDIA_TYPE" == *"index"* ]]; then
            PLATFORM_DIGEST=$(echo "$MANIFEST" | jq -r '.manifests[0].digest // empty')
            if [[ -n "$PLATFORM_DIGEST" ]]; then
              IMAGE_REPO="${IMAGE_REF%%@*}"
              MANIFEST=$(skopeo inspect --raw --tls-verify=false "docker://${IMAGE_REPO}@${PLATFORM_DIGEST}" 2>/dev/null) || MANIFEST='{}'
            fi
          fi

          BASE_NAME=$(echo "$MANIFEST" | jq -r '.annotations["org.opencontainers.image.base.name"] // empty')
          BASE_DIGEST=$(echo "$MANIFEST" | jq -r '.annotations["org.opencontainers.image.base.digest"] // empty')

          if [[ -n "$BASE_NAME" && -n "$BASE_DIGEST" ]]; then
            BASE_REF="${BASE_NAME%%:*}@${BASE_DIGEST}"
            echo "    Base image: $BASE_REF"
            DEP_LEVEL=""

            # Verify base image release signature
            if [[ -f /etc/base-image-keys/release.pub ]]; then
              if cosign verify --key /etc/base-image-keys/release.pub \
                  --insecure-ignore-tlog --allow-insecure-registry \
                  "$BASE_REF" >/dev/null 2>&1; then
                echo "    Base image release signature: verified"
              else
                echo "    WARNING: Base image release signature verification failed"
              fi
            fi

            # Verify base image provenance and determine dependency level
            if [[ -f /etc/base-image-keys/provenance.pub ]]; then
              BASE_ATTESTATION=$(cosign verify-attestation \
                --key /etc/base-image-keys/provenance.pub \
                --type https://slsa.dev/provenance \
                --insecure-ignore-tlog --allow-insecure-registry \
                "$BASE_REF" 2>/dev/null) || BASE_ATTESTATION=""

              if [[ -n "$BASE_ATTESTATION" ]]; then
                DEP_LEVEL="SLSA_BUILD_LEVEL_1"
                echo "    Base image provenance: verified (L1)"

                # Check builder ID for L2
                if [[ -n "$(params.BASE_IMAGE_BUILDER_ID)" ]]; then
                  BASE_BUILDER_ID=$(echo "$BASE_ATTESTATION" | head -1 | jq -r '
                    .payload | @base64d | fromjson |
                    .predicate.builder.id //
                    .predicate.runDetails.builder.id //
                    empty
                  ' 2>/dev/null) || BASE_BUILDER_ID=""

                  if [[ "$BASE_BUILDER_ID" == "$(params.BASE_IMAGE_BUILDER_ID)" ]]; then
                    DEP_LEVEL="SLSA_BUILD_LEVEL_2"
                    echo "    Base image builder ID matches: $BASE_BUILDER_ID (L2)"
                  else
                    echo "    Base image builder ID: ${BASE_BUILDER_ID:-not found} (expected $(params.BASE_IMAGE_BUILDER_ID))"
                  fi
                fi
              else
                echo "    Base image provenance: not found or verification failed"
              fi
            fi

            if [[ -n "$DEP_LEVEL" ]]; then
              DEPENDENCY_LEVELS=$(jq -n --arg level "$DEP_LEVEL" '{($level): 1}')
              echo "    Dependency level: $DEP_LEVEL"
            fi
          else
            echo "    Base image: none (scratch or not annotated)"
          fi

          # Generate the SLSA VSA predicate (cosign attest wraps it in
          # an in-toto statement using --type for predicateType)
          SLSA_VSA=$(jq -n \
            --arg ec_version "$EC_VERSION" \
            --arg time_verified "$EFFECTIVE_TIME" \
            --arg resource_uri "$IMAGE_REF" \
            --arg result "PASSED" \
            --argjson verified_levels "$VERIFIED_LEVELS" \
            --argjson dependency_levels "$DEPENDENCY_LEVELS" \
            --argjson policy "$POLICY_DESCRIPTOR" \
            '{
              "verifier": {
                "id": "https://conforma.dev/cli",
                "version": {"ec": $ec_version}
              },
              "timeVerified": $time_verified,
              "resourceUri": $resource_uri,
              "policy": $policy,
              "verificationResult": $result,
              "verifiedLevels": $verified_levels,
              "dependencyLevels": (if ($dependency_levels | keys | length) > 0 then $dependency_levels else null end),
              "slsaVersion": "1.0"
            }')

          SLSA_VSA_FILE="$VSA_DIR/slsa-vsa-${COMPONENT_NAME}.json"
          echo "$SLSA_VSA" > "$SLSA_VSA_FILE"
          echo "    Generated: $SLSA_VSA_FILE"
        done

        echo "SLSA VSA generation complete"
      env:
        - name: SSL_CERT_DIR
          value: "/tekton-custom-certs:/etc/ssl/certs:/etc/pki/tls/certs:/system/etc/security/cacerts:$(params.SSL_CERT_DIR)"
      volumeMounts:
        - name: trusted-ca
          mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
        - name: base-image-keys
          mountPath: /etc/base-image-keys
          readOnly: true

    - name: generate-svr
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        if [[ "$(params.VSA_GENERATED)" != "true" ]]; then
          echo "VSA was not generated, skipping SVR generation"
          exit 0
        fi

        if ! echo "$(params.ATTESTATION_TYPES)" | grep -q "svr"; then
          echo "svr not in ATTESTATION_TYPES, skipping SVR generation"
          exit 0
        fi

        VSA_DIR="$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)/vsa"
        REPORT="$VSA_DIR/report-json.json"

        if [[ ! -f "$REPORT" ]]; then
          echo "WARNING: Conforma JSON report not found at $REPORT, skipping SVR generation"
          exit 0
        fi

        echo "Generating Software Verification Report (SVR) from conforma report..."

        COMPONENT_COUNT=$(jq '.components | length' "$REPORT")
        echo "Processing $COMPONENT_COUNT component(s)..."

        # Compute the intersection of metadata.code values across all components.
        # Each component contributes a set of codes from its successes[]; only codes
        # present in every component are included in the SVR properties.
        INTERSECTED_CODES=$(jq -r '
          [.components[] | [.successes[].metadata.code] | unique] as $sets |
          if ($sets | length) == 0 then []
          else
            reduce $sets[] as $s (
              $sets[0];
              . as $current | map(select(. as $code | $s | any(. == $code)))
            )
          end | .[]
        ' "$REPORT")

        # Normalize each code to a CONFORMA_* property and collect SLSA level flags
        PROPERTIES=()
        HAS_ALL_TASKS_TRUSTED=false
        HAS_ALL_TASK_REFS_TRUSTED=false
        HAS_SLSA_BUILDER_ID_ACCEPTED=false

        while IFS= read -r code; do
          [[ -z "$code" ]] && continue
          # Uppercase and replace . with _ to form the property name
          NORMALIZED=$(echo "$code" | tr '[:lower:]' '[:upper:]' | tr '.' '_')
          PROPERTIES+=("CONFORMA_${NORMALIZED}")

          # Track codes needed for SLSA level assignment
          case "$code" in
            wild.all_tasks_trusted)          HAS_ALL_TASKS_TRUSTED=true ;;
            wild.all_task_refs_trusted)      HAS_ALL_TASK_REFS_TRUSTED=true ;;
            slsa_build_build_service.slsa_builder_id_accepted) HAS_SLSA_BUILDER_ID_ACCEPTED=true ;;
          esac
        done <<< "$INTERSECTED_CODES"

        # Add SLSA build level based on intersected codes
        if [[ "$HAS_ALL_TASKS_TRUSTED" == "true" && "$HAS_ALL_TASK_REFS_TRUSTED" == "true" ]]; then
          PROPERTIES+=("SLSA_BUILD_LEVEL_3")
          echo "  SLSA build level: SLSA_BUILD_LEVEL_3 (wild.all_tasks_trusted + wild.all_task_refs_trusted)"
        elif [[ "$HAS_SLSA_BUILDER_ID_ACCEPTED" == "true" ]]; then
          PROPERTIES+=("SLSA_BUILD_LEVEL_2")
          echo "  SLSA build level: SLSA_BUILD_LEVEL_2 (slsa_build_build_service.slsa_builder_id_accepted)"
        else
          echo "  SLSA build level: none (required codes not found in intersection)"
        fi

        echo "  Total properties: ${#PROPERTIES[@]}"

        # Build policies array by flattening all sources[].policy[] entries
        POLICIES=$(jq '[.policy.sources[].policy[] | {"uri": .}]' "$REPORT")

        # effective-time from the report
        TIME_CREATED=$(jq -r '."effective-time" // (now | todate)' "$REPORT")

        # Serialise the properties array for jq consumption
        PROPS_JSON=$(printf '%s\n' "${PROPERTIES[@]}" | jq -R . | jq -s .)

        # Write the SVR predicate (cosign attest wraps this in an in-toto statement)
        jq -n \
          --argjson policies "$POLICIES" \
          --arg time_created "$TIME_CREATED" \
          --argjson properties "$PROPS_JSON" \
          '{
            "verifier": {
              "id": "https://conforma.dev/cli",
              "policies": $policies
            },
            "timeCreated": $time_created,
            "properties": $properties
          }' > "$VSA_DIR/svr.json"

        echo "  SVR written to $VSA_DIR/svr.json"
        echo "  Properties (${#PROPERTIES[@]}): ${PROPERTIES[*]}"
        echo "SVR generation complete ($COMPONENT_COUNT component(s) processed)"
      env:
        - name: SSL_CERT_DIR
          value: "/tekton-custom-certs:/etc/ssl/certs:/etc/pki/tls/certs:/system/etc/security/cacerts:$(params.SSL_CERT_DIR)"
      volumeMounts:
        - name: trusted-ca
          mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true

    - name: attach-attestations
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      script: |
        #!/bin/bash
        set -euo pipefail

        if [[ "$(params.VSA_GENERATED)" != "true" ]]; then
          echo "VSA was not generated, skipping attestation attachment"
          exit 0
        fi

        echo "Signing and attaching attestations to destination images..."

        REPORT="$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)/vsa/report-json.json"
        SNAPSHOT_FILE="$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)/$(params.SNAPSHOT_FILENAME)"
        VSA_DIR="$(params.TRUSTED_ARTIFACTS_EXTRACT_DIR)/vsa"

        if [[ ! -f "$SNAPSHOT_FILE" ]]; then
          echo "ERROR: Snapshot file not found: $SNAPSHOT_FILE"
          exit 1
        fi

        if [[ ! -d "$VSA_DIR" ]]; then
          echo "ERROR: VSA directory $VSA_DIR not found"
          exit 1
        fi

        # Get the destination repo from the snapshot mapping.
        # The snapshot component has repository (destination) and
        # containerImage (build ref with digest). The digest is the same
        # in both locations since push-snapshot copies by digest.
        DEST_REPO=$(jq -r '.components[0].repository // empty' "$SNAPSHOT_FILE")
        if [[ -z "$DEST_REPO" ]]; then
          echo "WARNING: No repository mapping in snapshot, using build image refs"
        fi

        # Build component name → destination image mapping from the report.
        # Each conforma component has a unique name and build image digest.
        # The destination image is the same digest under the mapped repo.
        declare -A COMP_DEST_MAP
        while IFS=$'\t' read -r name digest; do
          if [[ -n "$DEST_REPO" ]]; then
            COMP_DEST_MAP["$name"]="${DEST_REPO}@${digest}"
          else
            COMP_DEST_MAP["$name"]="$name"
          fi
        done < <(jq -r '.components[] | [.name, (.containerImage | split("@") | .[1])] | @tsv' "$REPORT")

        echo "Component → destination mapping:"
        for name in "${!COMP_DEST_MAP[@]}"; do
          echo "  $name → ${COMP_DEST_MAP[$name]}"
        done
        echo ""

        if [[ -S /spiffe-workload-api/spire-agent.sock ]]; then
          echo "Initializing TUF root from local cluster for ambient verification..."
          cosign initialize --mirror http://tuf-server.tuf-system.svc.cluster.local --root http://tuf-server.tuf-system.svc.cluster.local/root.json 2>/dev/null || true
          echo "Waiting 5s for SPIRE server registration..."
          sleep 5
        fi

        # Attach each per-component VSA to its matching destination image.
        # svr.json is excluded here; it is attached to all images separately below.
        # VSA filenames encode the component name:
        #   vsa-<component-name>.json       → conforma custom VSA
        #   slsa-vsa-<component-name>.json  → standard SLSA VSA
        ERRORS=0
        for VSA_FILE in $(find "$VSA_DIR" -type f -name "*.json" ! -name "report-json.json" ! -name "svr.json"); do
          BASENAME=$(basename "$VSA_FILE" .json)

          # Extract component name and predicate type from filename; guard by type
          if [[ "$BASENAME" == slsa-vsa-* ]]; then
            if ! echo "$(params.ATTESTATION_TYPES)" | grep -q "slsa-vsa"; then
              echo "Skipping $BASENAME (slsa-vsa not in ATTESTATION_TYPES)"
              continue
            fi
            COMP_NAME="${BASENAME#slsa-vsa-}"
            PRED_TYPE="https://slsa.dev/verification_summary/v1"
          else
            if ! echo "$(params.ATTESTATION_TYPES)" | grep -q "conforma-vsa"; then
              echo "Skipping $BASENAME (conforma-vsa not in ATTESTATION_TYPES)"
              continue
            fi
            COMP_NAME="${BASENAME#vsa-}"
            PRED_TYPE="https://conforma.dev/verification_summary/v1"
          fi

          DEST_IMAGE="${COMP_DEST_MAP[$COMP_NAME]:-}"
          if [[ -z "$DEST_IMAGE" ]]; then
            echo "ERROR: No destination image for component '$COMP_NAME'"
            ERRORS=$((ERRORS + 1))
            continue
          fi

          echo "Attaching $BASENAME ($PRED_TYPE) → $DEST_IMAGE"
          if [[ -S /spiffe-workload-api/spire-agent.sock ]]; then
            echo "Using SPIFFE Workload Identity for keyless signing..."
            export SPIFFE_ENDPOINT_SOCKET="/spiffe-workload-api/spire-agent.sock"
            if ! cosign attest \
              --predicate "$VSA_FILE" \
              --type "$PRED_TYPE" \
              --use-signing-config=false \
              --fulcio-url="${SIGSTORE_FULCIO_URL:-http://fulcio-server.fulcio-system.svc.cluster.local}" \
              --rekor-url="${SIGSTORE_REKOR_URL:-http://rekor-server.rekor-system.svc.cluster.local}" \
              --yes \
              "$DEST_IMAGE"; then
              echo "ERROR: Failed to attach $BASENAME to $DEST_IMAGE"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "Using static signing key..."
            if ! cosign attest \
              --predicate "$VSA_FILE" \
              --type "$PRED_TYPE" \
              --key "$(params.VSA_SIGNING_KEY)" \
              --tlog-upload=false \
              "$DEST_IMAGE"; then
              echo "ERROR: Failed to attach $BASENAME to $DEST_IMAGE"
              ERRORS=$((ERRORS + 1))
            fi
          fi
        done

        # Attach the SVR to all destination images (it covers the whole snapshot)
        if [[ -f "$VSA_DIR/svr.json" ]] && echo "$(params.ATTESTATION_TYPES)" | grep -q "svr"; then
          echo "Attaching SVR to all destination images..."
          for name in "${!COMP_DEST_MAP[@]}"; do
            DEST_IMAGE="${COMP_DEST_MAP[$name]}"
            echo "Attaching svr.json → $DEST_IMAGE"
            if [[ -S /spiffe-workload-api/spire-agent.sock ]]; then
              export SPIFFE_ENDPOINT_SOCKET="/spiffe-workload-api/spire-agent.sock"
              if ! cosign attest \
                --predicate "$VSA_DIR/svr.json" \
                --type "https://in-toto.io/attestation/svr/v0.2" \
                --use-signing-config=false \
                --fulcio-url="${SIGSTORE_FULCIO_URL:-http://fulcio-server.fulcio-system.svc.cluster.local}" \
                --rekor-url="${SIGSTORE_REKOR_URL:-http://rekor-server.rekor-system.svc.cluster.local}" \
                --yes \
                "$DEST_IMAGE"; then
                echo "ERROR: Failed to attach SVR to $DEST_IMAGE"
                ERRORS=$((ERRORS + 1))
              fi
            else
              if ! cosign attest \
                --predicate "$VSA_DIR/svr.json" \
                --type "https://in-toto.io/attestation/svr/v0.2" \
                --key "$(params.VSA_SIGNING_KEY)" \
                --tlog-upload=false \
                "$DEST_IMAGE"; then
                echo "ERROR: Failed to attach SVR to $DEST_IMAGE"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
        fi

        if [[ "$ERRORS" -gt 0 ]]; then
          echo "ERROR: $ERRORS attestation(s) failed to attach"
          exit 1
        fi

        echo "Attestation attachment complete"
      env:
        - name: SSL_CERT_DIR
          value: "/tekton-custom-certs:/etc/ssl/certs:/etc/pki/tls/certs:/system/etc/security/cacerts:$(params.SSL_CERT_DIR)"
        - name: SPIFFE_ENDPOINT_SOCKET
          value: "unix:///spiffe-workload-api/spire-agent.sock"
        - name: SIGSTORE_FULCIO_URL
          value: "http://fulcio-server.fulcio-system.svc.cluster.local"
        - name: SIGSTORE_REKOR_URL
          value: "http://rekor-server.rekor-system.svc.cluster.local"
      volumeMounts:
        - name: trusted-ca
          mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          subPath: ca-bundle.crt
          readOnly: true
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true

  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.CA_TRUST_CONFIGMAP_NAME)
        items:
          - key: $(params.CA_TRUST_CONFIG_MAP_KEY)
            path: ca-bundle.crt
        optional: true
    - name: base-image-keys
      configMap:
        name: base-image-verification-keys
        optional: true
    - name: workdir
      emptyDir: {}
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
