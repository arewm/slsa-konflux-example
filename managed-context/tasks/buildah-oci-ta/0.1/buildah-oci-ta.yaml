---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: "konflux"
  name: buildah-oci-ta
spec:
  description: >-
    Demo builder task for the push-gating act: fetches the workload's
    JWT-SVID for the gated registry audience and initiates the OCI push
    handshake itself — the task, with this identity, no relay pods.
    Stands in for the full buildah build task.
  results:
    - name: push-status
      description: HTTP status line of the registry push handshake.
  stepTemplate:
    volumeMounts:
      - name: spiffe-workload-api
        mountPath: /spiffe-workload-api
        readOnly: true
  steps:
    - name: push-handshake
      image: registry-service.kind-registry/demo-tools/spiffe-curl:0.1
      script: |
        #!/bin/sh
        set -e
        # Tolerate SPIRE entry-minting lag for fresh pods.
        sleep 10
        spire-agent api fetch jwt \
          -audience https://registry-oidc.kind-registry:5000 \
          -socketPath /spiffe-workload-api/spire-agent.sock \
          -output json > /tmp/jwt.json
        JWT=$(jq -r '.[0].svids[0].svid' /tmp/jwt.json)
        echo "JWT-SVID subject: $(jq -r '.[0].svids[0].spiffe_id' /tmp/jwt.json)"
        echo "Initiating the OCI push handshake with the gated registry..."
        STATUS=$(curl -k -s -i -X POST -H "Authorization: Bearer ${JWT}" \
          https://registry-oidc.kind-registry:5000/v2/slsa-e2e-test/blobs/uploads/ \
          | tee /dev/stderr | head -n1 | tr -d '\r')
        printf '%s' "${STATUS}" > "$(results.push-status.path)"
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
