{{- if .Values.hardening }}
---
# Guard: managed-marker labels on PipelineRuns (CEL ValidatingPolicy).
#
# The managed markers (pipelines.appstudio.openshift.io/type=managed,
# appstudio.openshift.io/service=release) are what downstream policy
# (classify-release-authority, validate-role-labels) treats as proof that a
# PipelineRun was spawned by the release-service controller. A rogue actor
# able to hand-apply these labels to a PipelineRun in managed-tenant would
# launder itself into the release authority ("rogue pipeline" threat).
#
# This policy closes that hole in two ways:
#   1. marker-usurpation checks — the markers may only be newly set or
#      changed by the release-service controller ServiceAccount. Unrelated
#      updates (status/annotation patches by other controllers) that leave
#      the markers untouched are allowed, so Tekton Chains and the release
#      service reconciler keep working.
#   2. spec-injection check — label laundering via spec paths is closed: the
#      Tekton v1 PipelineRun CRD has no labels field on podTemplates, and the
#      one remaining spec path, taskRunSpecs[*].metadata.labels (the TaskRun
#      metadata template, which the Tekton controller applies to every
#      spawned TaskRun), is denied here regardless of creator — no legitimate
#      flow injects the managed markers through it.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: guard-managed-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelineruns"]
  variables:
    - name: newType
      expression: >-
        has(request.object.metadata.labels) && 'pipelines.appstudio.openshift.io/type' in request.object.metadata.labels
        ? request.object.metadata.labels['pipelines.appstudio.openshift.io/type'] : ''
    - name: oldType
      expression: >-
        request.oldObject != null && has(request.oldObject.metadata.labels) && 'pipelines.appstudio.openshift.io/type' in request.oldObject.metadata.labels
        ? request.oldObject.metadata.labels['pipelines.appstudio.openshift.io/type'] : ''
    - name: newService
      expression: >-
        has(request.object.metadata.labels) && 'appstudio.openshift.io/service' in request.object.metadata.labels
        ? request.object.metadata.labels['appstudio.openshift.io/service'] : ''
    - name: oldService
      expression: >-
        request.oldObject != null && has(request.oldObject.metadata.labels) && 'appstudio.openshift.io/service' in request.oldObject.metadata.labels
        ? request.oldObject.metadata.labels['appstudio.openshift.io/service'] : ''
  validations:
    # Marker transition TO the protected value requires the release-service
    # controller identity. On CREATE request.oldObject has no labels, so
    # creating a PipelineRun already carrying the marker counts as a
    # transition. Setting the label to any other value (e.g. type=build) is
    # not restricted.
    - expression: >-
        !(variables.newType == 'managed' && variables.newType != variables.oldType) ||
        request.userInfo.username == '{{ .Values.releaseServiceAccount }}'
      message: >-
        pipelines.appstudio.openshift.io/type=managed may only be set by the
        release-service controller ({{ .Values.releaseServiceAccount }}).
    - expression: >-
        !(variables.newService == 'release' && variables.newService != variables.oldService) ||
        request.userInfo.username == '{{ .Values.releaseServiceAccount }}'
      message: >-
        appstudio.openshift.io/service=release may only be set by the
        release-service controller ({{ .Values.releaseServiceAccount }}).
    # Verified against the Tekton v1 CRD: PipelineRun podTemplates carry no
    # labels field, so the only spec-level path that can inject labels onto
    # spawned TaskRuns is taskRunSpecs[*].metadata.labels. Denied regardless
    # of creator; an absent taskRunSpecs list makes exists() false.
    - expression: >-
        !has(request.object.spec.taskRunSpecs) ||
        !request.object.spec.taskRunSpecs.exists(t,
          has(t.metadata) && has(t.metadata.labels) &&
          (('pipelines.appstudio.openshift.io/type' in t.metadata.labels &&
            t.metadata.labels['pipelines.appstudio.openshift.io/type'] == 'managed') ||
           ('appstudio.openshift.io/service' in t.metadata.labels &&
            t.metadata.labels['appstudio.openshift.io/service'] == 'release')))
      message: >-
        Managed-marker labels may not be injected via PipelineRun
        taskRunSpecs[].metadata.labels; the Tekton controller would launder
        them onto spawned TaskRuns, bypassing the TaskRun-level guards.
{{- end }}
