{{- if .Values.hardening }}
---
# Guard: tekton.dev/* labels on TaskRuns (CEL ValidatingPolicy).
#
# The tekton.dev/pipeline, tekton.dev/pipelineTask and tekton.dev/pipelineRun
# labels are set by the Tekton pipelines controller when it spawns TaskRuns
# from a PipelineRun. Downstream policy (classify-release-authority,
# validate-role-labels) trusts these labels as proof of provenance from a
# real pipeline run, so a rogue actor hand-setting them on a standalone
# TaskRun could impersonate a task of a privileged pipeline.
#
# Denies any CREATE/UPDATE that newly sets or changes those labels unless the
# request originates from the Tekton pipelines controller ServiceAccount.
# Updates that leave the labels untouched (e.g. Tekton Chains annotation
# patches) are not affected, because the new value equals the old value.
# Scope note: the legacy ClusterPolicy matched only the tenant namespaces
# (values.namespaces); the CEL policy is deliberately CLUSTER-WIDE. The
# guarded invariants (marker labels, tekton.dev/* labels, trust-label
# recomputes, pod ownerRefs) hold for every namespace, and only the
# platform controllers are legitimate setters anywhere — so the wider
# scope is strictly safer. The namespaces values still scope the
# classification mutation and the ImageValidatingPolicy.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: guard-task-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["taskruns"]
  variables:
    # Label values on the incoming object ("" when absent).
    - name: newPipeline
      expression: >-
        has(request.object.metadata.labels) && 'tekton.dev/pipeline' in request.object.metadata.labels
        ? request.object.metadata.labels['tekton.dev/pipeline'] : ''
    - name: newPipelineTask
      expression: >-
        has(request.object.metadata.labels) && 'tekton.dev/pipelineTask' in request.object.metadata.labels
        ? request.object.metadata.labels['tekton.dev/pipelineTask'] : ''
    - name: newPipelineRun
      expression: >-
        has(request.object.metadata.labels) && 'tekton.dev/pipelineRun' in request.object.metadata.labels
        ? request.object.metadata.labels['tekton.dev/pipelineRun'] : ''
    # Label values on the object being replaced ("" on CREATE, where
    # request.oldObject has no labels).
    - name: oldPipeline
      expression: >-
        request.oldObject != null && has(request.oldObject.metadata.labels) && 'tekton.dev/pipeline' in request.oldObject.metadata.labels
        ? request.oldObject.metadata.labels['tekton.dev/pipeline'] : ''
    - name: oldPipelineTask
      expression: >-
        request.oldObject != null && has(request.oldObject.metadata.labels) && 'tekton.dev/pipelineTask' in request.oldObject.metadata.labels
        ? request.oldObject.metadata.labels['tekton.dev/pipelineTask'] : ''
    - name: oldPipelineRun
      expression: >-
        request.oldObject != null && has(request.oldObject.metadata.labels) && 'tekton.dev/pipelineRun' in request.oldObject.metadata.labels
        ? request.oldObject.metadata.labels['tekton.dev/pipelineRun'] : ''
  validations:
    - expression: >-
        !(variables.newPipeline != variables.oldPipeline ||
          variables.newPipelineTask != variables.oldPipelineTask ||
          variables.newPipelineRun != variables.oldPipelineRun) ||
        request.userInfo.username == '{{ .Values.tektonControllerServiceAccount }}'
      message: >-
        tekton.dev/pipeline, tekton.dev/pipelineTask and tekton.dev/pipelineRun
        labels may only be set by the Tekton pipelines controller
        ({{ .Values.tektonControllerServiceAccount }}).
{{- end }}
