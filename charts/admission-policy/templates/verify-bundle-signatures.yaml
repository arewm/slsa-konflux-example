{{- if .Values.trustedBundles }}
---
# Blocks TaskRuns referencing trusted bundle patterns that lack a valid signature.
# Requires the patched Kyverno build (fix/imageextractor-combined) for:
#   - filter field in imageExtractors (to isolate the bundle param from other params)
#   - SigstoreBundle static key support (to verify keypair-signed OCI referrer bundles)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-bundle-signatures
spec:
  failurePolicy: Fail
  validationFailureAction: Enforce
  rules:
  - name: require-valid-signature
    match:
      any:
      - resources:
          kinds: ["TaskRun"]
          namespaces: {{ .Values.namespaces | toJson }}
    {{- $regexParts2 := list }}
    {{- range .Values.trustedBundles }}
      {{- $regexParts2 = append $regexParts2 (.pattern | replace "." "[.]" | replace "*" ".*") }}
    {{- end }}
    {{- $bundleRegex2 := join "|" $regexParts2 }}
    context:
    - name: bundleRef
      variable:
        jmesPath: "request.object.spec.taskRef.params[?name == 'bundle'] | [0] | value || ''"
        default: ""
    - name: isDigestPinned
      variable:
        value: "{{`{{ regex_match('@sha256:[a-f0-9]{64}', bundleRef) }}`}}"
    - name: matchesPattern
      variable:
        value: "{{ `{{` }} regex_match('{{ $bundleRegex2 }}', bundleRef) {{ `}}` }}"
    preconditions:
      all:
      - key: "{{`{{ bundleRef }}`}}"
        operator: NotEquals
        value: ""
      - key: "{{`{{ isDigestPinned }}`}}"
        operator: Equals
        value: true
      - key: "{{`{{ matchesPattern }}`}}"
        operator: Equals
        value: true
    # Rule-level imageExtractors teach verifyImages where to find the bundle reference
    # in the TaskRun spec (resolver format and legacy direct format).
    imageExtractors:
      TaskRun:
      - path: "/spec/taskRef/params/*"
        name: "bundle"
        key: "name"
        value: "value"
        filter: "bundle"
      - path: "/spec/taskRef/bundle"
        name: "bundle"
    verifyImages:
    - type: SigstoreBundle
      imageReferences:
      {{- range .Values.trustedBundles }}
        - {{ .pattern | quote }}
      {{- end }}
      mutateDigest: false
      verifyDigest: true
      required: true
      attestors:
      {{- range .Values.trustedBundles }}
        {{- range .signingKeys }}
      - entries:
          - keys:
              publicKeys: {{ .publicKey | quote }}
              rekor:
                ignoreTlog: true
              ctlog:
                ignoreSCT: true
        {{- end }}
      {{- end }}
{{- end }}
