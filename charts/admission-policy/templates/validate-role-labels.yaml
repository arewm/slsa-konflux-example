{{- if .Values.hardening }}
{{- /* Convert glob patterns to a combined regex: escape dots, replace * with .* */}}
{{- $regexParts := list }}
{{- range .Values.trustedBundles }}
  {{- $regexParts = append $regexParts (.pattern | replace "." "[.]" | replace "*" ".*") }}
{{- end }}
{{- $bundleRegex := join "|" $regexParts }}
---
# Guard: classification label invariants on TaskRuns (CEL ValidatingPolicy).
#
# classify-taskrun / classify-release-authority are mutating policies and run
# with failurePolicy: Ignore (availability-first: a Kyverno outage degrades to
# "unclassified" rather than "down"). That means the trust labels they stamp
# must be validated, not just mutated: this policy recomputes the
# classification preconditions fail-closed and rejects TaskRuns whose labels
# claim a trust level their spec does not support (mutate-normalizes /
# validate-enforces split).
#
#   - trusted-task-role=prod: the bundle reference must exist, be pinned by an
#     immutable @sha256 digest, and match a trusted bundle pattern (mirrors
#     the upgrade-to-prod mutation in classify-taskrun).
#   - trusted-pipeline-role=release-authority: the TaskRun must live in the
#     managed namespace, carry the managed marker
#     (pipelines.appstudio.openshift.io/type=managed, propagated by the Tekton
#     controller from the release-service-created PipelineRun), and be owned
#     by a PipelineRun whose name matches the unforgeable
#     tekton.dev/pipelineRun label.
# Scope note: the legacy ClusterPolicy matched only the tenant namespaces
# (values.namespaces); the CEL policy is deliberately CLUSTER-WIDE. The
# guarded invariants (marker labels, tekton.dev/* labels, trust-label
# recomputes, pod ownerRefs) hold for every namespace, and only the
# platform controllers are legitimate setters anywhere — so the wider
# scope is strictly safer. The namespaces values still scope the
# classification mutation and the IVPOL.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: validate-role-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["taskruns"]
  variables:
    - name: taskRole
      expression: >-
        has(request.object.metadata.labels) && 'trusted-task-role' in request.object.metadata.labels
        ? request.object.metadata.labels['trusted-task-role'] : ''
    - name: pipelineRole
      expression: >-
        has(request.object.metadata.labels) && 'trusted-pipeline-role' in request.object.metadata.labels
        ? request.object.metadata.labels['trusted-pipeline-role'] : ''
    # The bundle reference from either resolver or direct taskRef format
    # ("" when the TaskRun has no bundle param).
    # Guard with has(.value): array-form params (values:) or a missing value
    # must yield "" rather than a CEL no-such-key error, which under
    # failurePolicy: Fail would deny every TaskRun with that param shape.
    - name: bundleRef
      expression: >-
        has(request.object.spec.taskRef) && has(request.object.spec.taskRef.params) &&
        request.object.spec.taskRef.params.filter(p, p.name == 'bundle').size() > 0 &&
        has(request.object.spec.taskRef.params.filter(p, p.name == 'bundle')[0].value)
        ? request.object.spec.taskRef.params.filter(p, p.name == 'bundle')[0].value : ''
    - name: pipelineRunLabel
      expression: >-
        has(request.object.metadata.labels) && 'tekton.dev/pipelineRun' in request.object.metadata.labels
        ? request.object.metadata.labels['tekton.dev/pipelineRun'] : ''
    - name: managedType
      expression: >-
        has(request.object.metadata.labels) && 'pipelines.appstudio.openshift.io/type' in request.object.metadata.labels
        ? request.object.metadata.labels['pipelines.appstudio.openshift.io/type'] : ''
    - name: pipelineRunOwnerName
      expression: >-
        has(request.object.metadata.ownerReferences) &&
        request.object.metadata.ownerReferences.filter(o, o.kind == 'PipelineRun').size() > 0
        ? request.object.metadata.ownerReferences.filter(o, o.kind == 'PipelineRun')[0].name : ''
  validations:
    - expression: >-
        variables.taskRole != 'prod' ||
        (variables.bundleRef != '' &&
         variables.bundleRef.matches('@sha256:[a-f0-9]{64}$'){{ if .Values.trustedBundles }} &&
         variables.bundleRef.matches('^({{ $bundleRegex }})'){{ end }})
      message: >-
        trusted-task-role=prod requires a digest-pinned taskRef bundle
        (@sha256) matching a trusted bundle pattern; recompute of the
        classification preconditions failed.
    - expression: >-
        variables.pipelineRole != 'release-authority' ||
        (request.namespace == 'managed-tenant' &&
         variables.managedType == 'managed' &&
         variables.pipelineRunLabel != '' &&
         variables.pipelineRunLabel == variables.pipelineRunOwnerName)
      message: >-
        trusted-pipeline-role=release-authority requires the TaskRun to be in
        a managed namespace, carry the Tekton-propagated managed marker
        (pipelines.appstudio.openshift.io/type=managed), and be owned by a
        PipelineRun.
{{- end }}
