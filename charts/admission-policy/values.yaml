# Verification engine to enforce bundle signatures:
# - "ivpol": Uses ImageValidatingPolicy (policies.kyverno.io/v1beta1).
#   CEL-based, works on stock Kyverno (v1.16/v1.17+) without controller patches or ConfigMap restart.
# - "clusterpolicy": Uses legacy ClusterPolicy verifyImages (kyverno.io/v1).
#   Requires Kyverno >=1.19.2 (or patched controller with PR #16269) and runs the cm/kyverno patch job.
# - "both": Deploys both policies simultaneously (for testing/benchmarking on patched clusters).
# - "none": Disables admission signature verification (only classification is applied).
verificationMode: "ivpol"

# Trusted bundle patterns with signing keys.
# Each entry is matched as a glob prefix against the TaskRun bundle reference.
# Leave signingKeys empty to configure the pattern without verification
# (useful before tasks are signed — everything lands on dev).
# Registry credentials Kyverno uses to fetch manifests for signature
# verification. Secrets must exist in the Kyverno namespace; the Konflux
# internal registry auth secret is propagated there by the operator.
registryCredentials:
  - internal-registry-client-auth

trustedBundles: []
# Example:
#   - pattern: "quay.io/konflux-ci/tekton-catalog/*"
#     signingKeys:
#       - name: "konflux-release-2026"
#         publicKey: |
#           -----BEGIN PUBLIC KEY-----
#           ...
#           -----END PUBLIC KEY-----

# Namespaces where TaskRun classification is applied.
# These namespaces also get labeled trusted-tasks-enabled: "true" by the chart.
namespaces:
  - default-tenant
  - managed-tenant

# ---------------------------------------------------------------------------
# Release boundary hardening ("label guards")
#
# fail-closed ClusterPolicies that partition who may set the classification
# and managed-marker labels. The mutate policies above (classify-taskrun,
# classify-release-authority) run with failurePolicy: Ignore so a Kyverno
# outage degrades to "unclassified" rather than "down"; these validate
# policies enforce the label invariants with failurePolicy: Fail.
# Set hardening: false to deploy the pre-hardening behavior (demo comparison).
# ---------------------------------------------------------------------------
hardening: true

# ServiceAccount of the release-service controller that legitimately creates
# managed release PipelineRuns. Only this identity may attach the managed
# marker labels (pipelines.appstudio.openshift.io/type=managed,
# appstudio.openshift.io/service=release) to a PipelineRun.
releaseServiceAccount: "system:serviceaccount:release-service:release-service-controller-manager"

# ServiceAccount of the Tekton pipelines controller that legitimately sets
# tekton.dev/* labels on TaskRuns (via propagation from a PipelineRun).
tektonControllerServiceAccount: "system:serviceaccount:tekton-pipelines:tekton-pipelines-controller"
